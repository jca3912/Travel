# ============================================================
#  errorfare — configuración
#  Vigilancia: Las Vegas / Los Ángeles → Madrid
# ============================================================

[general]
# Fuente de precios:
#   "gflights" — Google Flights vía el paquete fast-flights. Gratis, sin
#                registro. Es un scraper no oficial: puede romperse si Google
#                cambia su web, y desde IPs de servidor pueden bloquearlo.
#   "serpapi"  — los mismos datos servidos por SerpApi. De pago (25 $/mes por
#                1.000 búsquedas) pero estable. Necesita SERPAPI_KEY en .env.
provider     = "gflights"

currency     = "USD"          # compras desde EE. UU., las tarifas van en dólares
adults       = 1
travel_class = "ECONOMY"      # ECONOMY | PREMIUM_ECONOMY | BUSINESS | FIRST

# Tope de búsquedas por pasada. Freno de mano contra bucles y sorpresas.
max_api_calls_per_run = 60


[search]
# Ventana de búsqueda: desde hoy+min a hoy+max
min_days_ahead = 21
max_days_ahead = 330

# Con sólo 2 rutas se puede barrer mucha fecha.
# 2 rutas × 16 fechas = 32 búsquedas/día ≈ 960/mes.
# Si pasas a "serpapi", baja a 14 para no rozar el límite de 1.000/mes.
samples_per_route = 16

# Duraciones de viaje en noches. Cada día rota a la siguiente.
trip_lengths = [7, 10, 14, 21]

# Desactivado: con 16 muestras interesa más repartir fechas por toda la
# ventana que concentrarlas en viernes. Los errores de tarifa no eligen día.
prefer_weekend = false

one_way = false


# --- Escalas -------------------------------------------------
# Se cuentan POR TRAYECTO: "1" significa como mucho una escala de ida
# y una de vuelta, no una en todo el viaje.

max_stops = 2                 # más de esto se descarta directamente
preferred_max_stops = 1       # lo que quieres de verdad

# Cuánto más barato tiene que ser un itinerario de 2 escalas para que se
# prefiera a uno de 1. Con 15, una segunda escala sólo gana si ahorra más
# del 15 %; si no, se queda el de una escala aunque sea algo más caro.
stop_penalty_pct = 15


[detection]
min_observations = 8
mad_z_alert = 3.0             # → CHOLLO
mad_z_error = 5.0             # → POSIBLE ERROR
drop_pct_alert = 0.35         # −35 % → CHOLLO
drop_pct_error = 0.60         # −60 % → POSIBLE ERROR
cooldown_hours = 20
history_window_days = 120


# ============================================================
#  RUTAS
#  Mismo destino, dos orígenes. `alert_below` es el precio de
#  ida y vuelta por persona que ya te parece un chollo; a la
#  mitad de esa cifra se marca como POSIBLE ERROR.
# ============================================================

# Origen principal: sales de casa.
[[routes]]
origin      = "LAS"
destination = "MAD"
label       = "Las Vegas"
alert_below = 550

# Origen alternativo: sólo compensa si es bastante más barato, porque
# primero tienes que plantarte en Los Ángeles. Por eso el umbral es más
# exigente que el de Las Vegas, no igual.
[[routes]]
origin      = "LAX"
destination = "MAD"
label       = "Los Ángeles"
alert_below = 450
